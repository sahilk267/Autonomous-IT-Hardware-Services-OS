name: Apex OS verification
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (including native optional packages)
        run: |
          npm install --include=optional --no-audit --no-fund
          if ! node -e "require('@rollup/rollup-linux-x64-gnu')" >/dev/null 2>&1; then
            echo "Installing the missing Rollup binary matching the installed Rollup version"
            npm install --no-save --include=optional --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")"
          fi
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Isolated regression tests
        run: npm test
      - name: Deterministic sign-in rate limit unit tests
        run: npm run test:auth
      - name: Production-mode HTTP smoke test (throwaway DB)
        run: npm run smoke
      - name: Multi-role API access smoke test (throwaway DB)
        run: npm run smoke:roles
      - name: Production data-path and offline backup smoke test
        run: npm run smoke:data
      - name: Customer migration preflight (read-only, isolated fixtures)
        run: npm run smoke:preflight
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22 for current Chromium
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --include=optional --no-audit --no-fund
          if ! node -e "require('@rollup/rollup-linux-x64-gnu')" >/dev/null 2>&1; then
            npm install --no-save --include=optional --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")"
          fi
      - name: Build production application
        run: npm run build
      - name: Install current Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Real browser login and cross-customer isolation (throwaway DB)
        run: npm run smoke:browser

  postgres-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase10_local_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: phase10_local_ci_only
      PGDATABASE: apex_stage_ci
      APEX_PG_STAGING_ACK: STAGING_ONLY_NO_PRODUCTION
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node and PostgreSQL client dependencies
        run: |
          npm install --include=optional --no-audit --no-fund
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create empty throwaway staging database
        run: psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE apex_stage_ci'
      - name: Install forced RLS + tenant/customer FK schema
        run: psql -v ON_ERROR_STOP=1 -f migrations/postgres/001_staging_rls.sql
      - name: Real PostgreSQL isolation and transactional import tests
        run: npm run smoke:postgres
      - name: Install authenticated staged-write RLS, trigger audit, and local pilot login
        run: |
          psql -v ON_ERROR_STOP=1 -f migrations/postgres/002_staging_authenticated_pilot.sql
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE apex_pilot_login LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'pilot_only_local_ci_password'"
          psql -d postgres -v ON_ERROR_STOP=1 -c "GRANT apex_pilot_writer TO apex_pilot_login"
      - name: Install signed per-transaction actor context and project/ticket SQL policies
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f migrations/postgres/003_staging_signed_context_domains.sql
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "APEX_PG_PILOT_CONTEXT_KEY=$key" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO apex.pilot_context_secrets(key_id,secret) VALUES('active',decode('$key','hex'))"
      - name: Install asset and field-job custody authorization policies
        run: psql -v ON_ERROR_STOP=1 -f migrations/postgres/004_staging_assets_field_jobs.sql
      - name: Authenticated SQL-backed staging CRUD and audit HTTP checks
        env:
          APEX_PG_PILOT_HOST: 127.0.0.1
          APEX_PG_PILOT_DB: apex_stage_ci
          APEX_PG_PILOT_USER: apex_pilot_login
          APEX_PG_PILOT_PASSWORD: pilot_only_local_ci_password
          APEX_PG_PILOT_ACK: LOCAL_STAGING_ONLY_NO_CUTOVER
        run: |
          npm run build
          npm run smoke:pg:pilot
      - name: Isolated PostgreSQL snapshot and restore rehearsal
        run: |
          set -euo pipefail
          export PGRESTORE_DATABASE=apex_stage_restored
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE apex_stage_restored'
          dump="$RUNNER_TEMP/apex-phase10-throwaway.dump"
          trap 'rm -f "$dump"' EXIT
          # Host runner may ship PostgreSQL 18 clients; match the PostgreSQL 16 service's tools.
          postgres_container="$(docker ps --filter 'ancestor=postgres:16-alpine' -q | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" pg_dump -U postgres -Fc --no-owner -d apex_stage_ci > "$dump"
          docker exec -i "$postgres_container" pg_restore -U postgres --no-owner --exit-on-error \
            -d "$PGRESTORE_DATABASE" < "$dump"
          npm run smoke:pg:restore
