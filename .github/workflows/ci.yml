name: Apex OS verification
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Isolated regression tests
        run: npm test
