name: Phase L tenancy and security checks

on:
  push:
    branches:
      - security/phase-l-isolation-csrf-20261111
  pull_request:

permissions:
  contents: read

jobs:
  phase-l:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lockfile-free npm install is temporary; pin an npm lockfile before release.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
