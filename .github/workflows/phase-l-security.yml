name: Phase L tenancy and security checks

on:
  push:
    branches:
      - security/phase-l-isolation-csrf-20261111
  pull_request:

permissions:
  contents: read

jobs:
  phase-l:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase-l-ci-only
          POSTGRES_DB: apex_phase_l_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apex_phase_l_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lockfile-free npm install is temporary; pin an npm lockfile before release.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run test:postgres
        env:
          PG_TEST_URL: postgres://postgres:phase-l-ci-only@127.0.0.1:5432/apex_phase_l_ci
      - run: npm run build
