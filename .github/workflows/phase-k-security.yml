name: Phase K security verification

on:
  push:
    branches:
      - security/phase-k-p0-hardening-20261111
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The repository currently has no package-lock.json. Use npm install until
      # reproducible lockfile generation is addressed in a follow-up.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
