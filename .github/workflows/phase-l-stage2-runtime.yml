name: Phase L Stage 2 — PostgreSQL runtime E2E

on:
  push:
    branches:
      - feature/phase-l-stage2-postgres-runtime-20261112
  pull_request:

permissions:
  contents: read

jobs:
  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stage2-ci-superuser-only
          POSTGRES_DB: apex_phase_l_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apex_phase_l_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:postgres
        env:
          PG_TEST_URL: postgres://postgres:stage2-ci-superuser-only@127.0.0.1:5432/apex_phase_l_ci
      - run: npm run test:stage2
        env:
          PG_TEST_URL: postgres://postgres:stage2-ci-superuser-only@127.0.0.1:5432/apex_phase_l_ci
